[project]
name = "travel-agent"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastmcp<=2.0",
    "gradio==6.20.0",
    "fastapi>=0.115.8,<1",
    "uvicorn==0.40.0",
    "httpx==0.28.1",
    "aiohttp>=3.10,<4",
    "requests>=2.32,<3",
    "langgraph==1.0.5",
    "mcp==1.25.0",
    "openai>=1.75.0",
    "python-dotenv>=1.2.2",
    "qdrant-client==1.12.2",
    "langfuse>=4.6.1",
    "pymysql>=1.1.1",
    "redis>=5.2.0",
    "pika>=1.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
]

# The application is intentionally a flat collection of scripts.  Disable
# setuptools' automatic package discovery so `pip install .` only installs
# runtime dependencies; Docker executes the copied sources directly.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 60
addopts = "--cov=. --cov-report=term-missing:skip-covered"
filterwarnings = [
    "ignore:Please use `import python_multipart` instead\\.:PendingDeprecationWarning:gradio\\.routes",
    "ignore:There is no current event loop:DeprecationWarning:gradio\\.utils",
    "ignore:\\s*on_event is deprecated, use lifespan event handlers instead\\..*:DeprecationWarning:gradio\\.routes",
    "ignore:\\s*on_event is deprecated, use lifespan event handlers instead\\..*:DeprecationWarning:fastapi\\.applications",
    "ignore:Passing 'msg' argument to (Task|Future)\\.cancel\\(\\) is deprecated.*:DeprecationWarning:anyio\\._backends\\._asyncio",
    "ignore:Passing 'msg' argument to (Task|Future)\\.cancel\\(\\) is deprecated.*:DeprecationWarning:asyncio\\.events",
]
markers = [
    "unit: single-module/unit tests",
    "integration: cross-module integration tests; real middleware tests auto-skip when unavailable",
    "full: full test suite, including unit and integration tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "htmlcov/*",
    "memory/*",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.travel_agent.coverage.unit.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "htmlcov/*",
    "memory/*",
    "backend.py",
    "gradio_manager.py",
    "industrial_runtime.py",
    "industrial_worker.py",
    "lightweight_embedding.py",
    "main.py",
    "mcp_client.py",
    "mcp_server.py",
    "memory_consolidator.py",
    "memory_manager.py",
    "travel_agent.py",
]

[tool.travel_agent.coverage.unit.report]
skip_covered = true
show_missing = true
fail_under = 80
omit = [
    "tests/*",
    ".venv/*",
    "htmlcov/*",
    "memory/*",
    "backend.py",
    "gradio_manager.py",
    "industrial_runtime.py",
    "industrial_worker.py",
    "lightweight_embedding.py",
    "logger.py",
    "main.py",
    "mcp_client.py",
    "mcp_server.py",
    "memory_consolidator.py",
    "memory_manager.py",
    "observability.py",
    "travel_agent.py",
]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.travel_agent.coverage.integration.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "htmlcov/*",
    "memory/*",
    "lightweight_embedding.py",
    "main.py",
    "memory_manager.py",
    "tools/*",
]

[tool.travel_agent.coverage.integration.report]
skip_covered = true
show_missing = true
fail_under = 80
omit = [
    "tests/*",
    ".venv/*",
    "htmlcov/*",
    "memory/*",
    "lightweight_embedding.py",
    "logger.py",
    "main.py",
    "memory_manager.py",
    "*/tools/*",
]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
